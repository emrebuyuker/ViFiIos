# SwiftLint configuration for ViFi (SwiftUI, Swift 6).
# Runs as a post-compile build phase (see project.yml) and locally with `swiftlint lint`.
# Auto-fix what can be fixed with `swiftlint --fix`.

included:
  - ViFi
  - ViFiTests
  - ViFiUITests

excluded:
  # Preview-only assets and sample data.
  - ViFi/Preview Content
  # Build products and package checkouts.
  - DerivedData
  - .build

disabled_rules:
  - trailing_comma # Trailing commas keep multi-line literals diff-friendly.
  - todo           # TODOs are tracked in issues, not as warnings.

opt_in_rules:
  # Performance
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - first_where
  - last_where
  - sorted_first_last
  # Idiomatic Swift
  - fatal_error_message
  - force_unwrapping
  - redundant_nil_coalescing
  - redundant_type_annotation
  - shorthand_optional_binding
  - toggle_bool
  # Concurrency & SwiftUI
  - private_swiftui_state
  - unhandled_throwing_task
  # Accessibility
  - accessibility_trait_for_button
  # Style
  - closure_spacing
  - implicit_return
  - modifier_order
  - vertical_whitespace_closing_braces
  # Tests
  - balanced_xctest_lifecycle
  - empty_xctest_method
  - xct_specific_matcher

analyzer_rules: # `swiftlint analyze --compiler-log-path <xcodebuild.log>`
  - unused_import

# MARK: - Rule configuration

line_length:
  warning: 160
  error: 200
  ignores_comments: true
  ignores_urls: true

identifier_name:
  excluded:
    - id
    - x
    - y
    - i

type_body_length:
  warning: 300
  error: 450

file_length:
  warning: 500
  error: 800
  ignore_comment_only_lines: true

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 12
  error: 20
  ignores_case_statements: true

nesting:
  type_level: 2

empty_count:
  severity: warning
  only_after_dot: true # `.count == 0`, not a local named `count`.

unused_optional_binding:
  ignore_optional_try: false

unhandled_throwing_task:
  severity: warning

# MARK: - Project rules

custom_rules:
  no_print:
    name: "No print"
    regex: '\b(print|debugPrint|NSLog)\s*\('
    match_kinds:
      - identifier
    message: "Log with OSLog instead (Logger.archive, Logger.files, Logger.app)."
    severity: warning

  observation_over_combine:
    name: "Observation over Combine"
    regex: '(\bimport\s+Combine\b|\bObservableObject\b|@Published\b|@StateObject\b|@ObservedObject\b|@EnvironmentObject\b)'
    excluded_match_kinds:
      - comment
      - comment.mark
      - comment.url
      - doccomment
      - doccomment.field
      - string
    message: "Use the Observation framework (@Observable, @State, @Environment) instead of Combine/ObservableObject."
    severity: warning
