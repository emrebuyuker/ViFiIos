name: ViFi

options:
  bundleIdPrefix: com.BuyukerYazilim
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
  minimumXcodeGenVersion: "2.42.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Shared xcconfig; pulls in the gitignored Config/Secrets.xcconfig (Google Maps API key) when it exists.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    MARKETING_VERSION: "4.0.0"
    CURRENT_PROJECT_VERSION: "9"
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  # Admin location picker for campaign notifications (map + place search). No CoreLocation / "my location".
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    from: 11.2.0
  GooglePlaces:
    url: https://github.com/googlemaps/ios-places-sdk
    from: 11.2.0

targets:
  ViFi:
    type: application
    platform: iOS
    sources:
      - path: ViFi
        excludes:
          # Generated from `info:` below and wired up as INFOPLIST_FILE, not a resource.
          - Resources/Info.plist
          # A StoreKit testing configuration wired into the scheme's run action, not bundled as a resource.
          - Resources/ViFi.storekit
    info:
      path: ViFi/Resources/Info.plist
      properties:
        CFBundleDisplayName: ViFi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: tr
        CFBundleLocalizations:
          - tr
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Screen views are reported explicitly from SwiftUI.
        FirebaseAutomaticScreenReportingEnabled: false
        # AppDelegate forwards the APNs token, silent pushes and URLs to Firebase Auth explicitly;
        # swizzling is unreliable with the SwiftUI lifecycle.
        FirebaseAppDelegateProxyEnabled: false
        # Phone sign-in falls back to a reCAPTCHA page that returns through the encoded app id scheme.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: phone-auth-recaptcha
            CFBundleURLSchemes:
              - app-1-441043948320-ios-05fac6c5c1ec991258bd45
        # Firebase Auth verifies the app with a silent push before sending the SMS code.
        UIBackgroundModes:
          - remote-notification
        # The Google Maps / Places API key, injected from Config/Secrets.xcconfig (never committed). Read by
        # GoogleMapsConfiguration; empty or unexpanded means the location picker reports itself unavailable.
        GMSApiKey: $(GOOGLE_MAPS_API_KEY)
        # Lets the inbox's "Konuma Git" check whether the Google Maps app is installed.
        LSApplicationQueriesSchemes:
          - comgooglemaps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.BuyukerYazilim.ViFi2
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"ViFi/Preview Content\""
        ENABLE_PREVIEWS: YES
        # Push notifications (phone sign-in app verification) and App Attest (App Check).
        CODE_SIGN_ENTITLEMENTS: ViFi/Resources/ViFi.entitlements
        # The SwiftLint phase reads sources outside the script's declared inputs.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        "DEVELOPMENT_TEAM[sdk=iphoneos*]": A9ZTFRX9B5
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": iPhone Developer
        PROVISIONING_PROFILE_SPECIFIER: ""
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": ViFi Development
      configs:
        Release:
          # Sample exams back the DEBUG-only mock data; keep them out of shipped builds.
          EXCLUDED_SOURCE_FILE_NAMES: "sample-page-*.jpg sample-exam.pdf"
    dependencies:
      - package: Firebase
        product: FirebaseDatabase
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAnalyticsCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleMaps
        product: GoogleMaps
      - package: GooglePlaces
        product: GooglePlaces
      # Embedded: attaches campaign images to pushes and raises the icon badge.
      - target: ViFiNotificationService
    postCompileScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint lint --quiet --config "${SRCROOT}/.swiftlint.yml"
          else
            echo "warning: SwiftLint is not installed (brew install swiftlint)"
          fi

  # Notification Service Extension (NOTIFICATIONS.md §5): runs for every push (`mutable-content` is always set) to
  # raise the icon badge by one (App Group defaults shared with the app) and attach the campaign image.
  ViFiNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: ViFiNotificationService
        excludes:
          # Generated from `info:` below and wired up as INFOPLIST_FILE, not a resource.
          - Info.plist
      # The badge counter the app and the extension share; unit-tested through the app target.
      - path: ViFi/Core/Utilities/NotificationBadgeCounter.swift
    info:
      path: ViFiNotificationService/Info.plist
      properties:
        CFBundleDisplayName: ViFi Bildirimleri
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: tr
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.BuyukerYazilim.ViFi2.NotificationService
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        # App Group shared with the app (the icon badge).
        CODE_SIGN_ENTITLEMENTS: ViFiNotificationService/ViFiNotificationService.entitlements
        # Like the app: simulator builds sign locally with no team or profile; device builds sign automatically
        # (Xcode registers the extension's App ID and App Group under the team).
        CODE_SIGN_STYLE: Manual
        "CODE_SIGN_STYLE[sdk=iphoneos*]": Automatic
        DEVELOPMENT_TEAM: ""
        "DEVELOPMENT_TEAM[sdk=iphoneos*]": A9ZTFRX9B5
    dependencies:
      - package: Firebase
        product: FirebaseMessaging

  ViFiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ViFiTests
    dependencies:
      - target: ViFi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.BuyukerYazilim.ViFi2.tests
        # The manual "ViFi Development" profile covers the app only; test bundles sign automatically.
        CODE_SIGN_STYLE: Automatic
        "DEVELOPMENT_TEAM[sdk=iphoneos*]": A9ZTFRX9B5

  ViFiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ViFiUITests
    dependencies:
      - target: ViFi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.BuyukerYazilim.ViFi2.uitests
        # The manual "ViFi Development" profile covers the app only; test bundles sign automatically.
        CODE_SIGN_STYLE: Automatic
        "DEVELOPMENT_TEAM[sdk=iphoneos*]": A9ZTFRX9B5

schemes:
  ViFi:
    build:
      targets:
        ViFi: all
        ViFiTests: [test]
        ViFiUITests: [test]
    run:
      config: Debug
      # Local StoreKit products for simulator testing, until the App Store Connect products are live.
      storeKitConfiguration: ViFi/Resources/ViFi.storekit
    test:
      config: Debug
      gatherCoverageData: true
      # Unit tests run inside the app; keep the host off Firebase and the App Store.
      commandLineArguments:
        "-ViFiMockData": true
      coverageTargets:
        - ViFi
      targets:
        - ViFiTests
        - ViFiUITests
    archive:
      config: Release
